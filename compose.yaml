# Whole stack with one command: docker compose up --build
# Every module owns its compose.yaml and can be deployed on its own; this file only includes them.
# scraper/, analytics/ and api/ add their compose.yaml here when they are containerised.
include:
  - infra/compose.yaml
  - web/compose.yaml
  - api/compose.yaml
  # analytics needs redis from infra (PR #18, chore/infra-compose-v2): merge after it.
  - analytics/compose.yaml
