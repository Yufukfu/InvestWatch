schema: spec-driven

context: |
  Language: en
  All artifacts must be written in en.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  Project: InvestWatch, a hackathon system that finds risky investment content online (UKNF challenge).
  Modules: scraper/, web/ dashboard, analytics/, api/ and contracts/; owners only in .github/CODEOWNERS. Light separate services,
  one `docker compose up`, open-source and on-premise only. Read .docs/STATUS.md, the .docs/status/ file for your directories and .docs/integration-plan.md
  (contracts ScrapedDocument and Finding, v1) before proposing anything. Contracts are frozen after
  Sat 14:30; a change that alters one must say so and bump the version.
  Project skills that attach to this workflow: iw-commit-cycle (commits and review), iw-docs-update
  (docs, ADRs, STATUS), iw-ai-log (AI log entry), iw-pr-review (final review). The reviewer agent is
  iw-reviewer (.claude/agents).

rules:
  proposal:
    - State what is out of scope and which module owns the change.
    - Name any contract, REST route or event the change touches, or say it touches none.
    - One change covers one capability (for example scraper-v1), not one task.
  specs:
    - Every requirement has at least one scenario in WHEN/THEN form that a test can check.
    - Scenarios for scraped content cover the failure path (blocked, empty, malformed), not only success.
    - Reference the contracts in .docs/integration-plan.md instead of restating them.
  design:
    - Record choices that are hard to reverse as an ADR in .docs/decisions/ (written by the agent, committed as accepted, in this change's PR).
  tasks:
    - Each task group is one commit-sized unit whose first task is its failing test. Keep tasks under about 2 hours.
    - 'Each task group ends with a mutation-check task (iw-commit-cycle step 3); when done, its tasks.md line reads `mutations: N tried, N caught` (or `mutations: n/a, <reason>`).'
    - Every tasks.md ends with these closing tasks, in this order - (1) apply the iw-docs-update skill (docs, the .docs/status/ file for the directories you changed, ADRs) and add the iw-ai-log entry; (2) run the iw-pr-review skill and fix real findings.

operations:
  apply:
    guidance:
      - Before committing each task group, load and follow the iw-commit-cycle skill (test first, mutation check, stage and commit as separate calls, iw-reviewer on the range of each task group that has logic). Do not implement outside this apply flow.
      - When all tasks are complete, run /openspec-archive-change as the last commit of the branch, then push the branch and open the PR with the iw-pr-review body (never main, never --force). Stop there: the human approves and merges; never merge or approve yourself.
  archive:
    guidance:
      - Archive as the last commit of the PR branch, after the iw-pr-review task is done. Any later code change would need a new change or IW_SKIP_SPEC=1.
