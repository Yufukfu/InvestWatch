# Shared infrastructure: database and HTTPS gateway. Each module ships its own compose.yaml;
# the root compose.yaml includes them all. Modules only meet through network contracts
# (REST/Socket.IO via the gateway, Postgres, later Redis), never through shared code.
services:
  postgres:
    image: public.ecr.aws/docker/library/postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-investwatch}
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-iw_admin}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?set POSTGRES_ADMIN_PASSWORD in .env (scripts/init-env.sh)}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      IW_APP_USER: ${POSTGRES_APP_USER:-iw_app}
      IW_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?set POSTGRES_APP_PASSWORD in .env (scripts/init-env.sh)}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    # No host port: data is internal, so the DB is unreachable from outside the stack.
    # Local access: docker compose exec postgres psql -U iw_admin -d investwatch
    networks: [data]
    security_opt: [no-new-privileges:true]
    shm_size: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }

  # Stream iw:documents, pub/sub iw:events, key iw:settings:thresholds (ADR 0305: must persist, hence AOF).
  # noeviction: a full instance rejects writes instead of silently dropping stream entries.
  # Redis 8 under its AGPLv3 option, image pinned by digest (ADR 0306).
  redis:
    image: public.ecr.aws/docker/library/redis:8-alpine@sha256:7958cfbb9d152f87dadfbc89f1b0b15938f0b81ff8982feb327476f4911935c3
    restart: unless-stopped
    user: redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env (scripts/init-env.sh)}
    command:
      - sh
      - -c
      # Password over stdin (`-` reads config from it), so it never appears in the process arguments.
      # A heredoc, not a pipe: `exec` must replace PID 1 so redis-server gets SIGTERM and shuts down cleanly.
      # maxmemory at half the container limit leaves room for the AOF-rewrite fork (copy-on-write).
      - |
        umask 0077
        exec redis-server - --appendonly yes --appendfsync everysec --maxmemory 128mb --maxmemory-policy noeviction <<EOF
        requirepass $$REDIS_PASSWORD
        EOF
    volumes:
      - redisdata:/data
    networks: [data]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256M }

  # S3-compatible object storage for bucket iw-raw (html/, shot/, media/; integration-plan §2).
  # MinIO built from source by Chainguard, pinned by digest (ADR 0306). No host port: data network only.
  minio:
    image: &minio-image cgr.dev/chainguard/minio@sha256:e9cf6b99c226e9539ed0f14b6f00e37b07da153c7ba1f4f8709c807574b471ec
    restart: unless-stopped
    command: ["server", "/data", "--address", ":9000", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-iw-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env (scripts/init-env.sh)}
      MINIO_BROWSER: "off"
    volumes:
      - miniodata:/data
    networks: [data]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      # The image has bash but no curl, wget or grep: plain HTTP over /dev/tcp, no credentials needed.
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /minio/health/live HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          read -r status <&3 && [[ $$status == *' 200'* ]]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }

  # One-shot: private bucket + app user limited to it (infra/minio/init.sh). Modules wait for it with
  # depends_on: { minio-init: { condition: service_completed_successfully } }.
  minio-init:
    image: *minio-image
    restart: "no"
    entrypoint: ["sh", "/init/init.sh"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-iw-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env (scripts/init-env.sh)}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-iw-app}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?set MINIO_SECRET_KEY in .env (scripts/init-env.sh)}
      MINIO_BUCKET: ${MINIO_BUCKET:-iw-raw}
    volumes:
      - ./minio/init.sh:/init/init.sh:ro
    depends_on:
      minio: { condition: service_healthy }
    networks: [data]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 128M }

  # Local LLM fallback (ADR 0304): only with `docker compose --profile llm up`, so a plain `up` downloads
  # no weights. Analytics reaches it on data: LLM_BASE_URL=http://ollama:11434/v1. The serving instance is
  # on data only: Ollama's API is unauthenticated, so with egress any data container could make it pull
  # from or push to an arbitrary registry. Docker Hub is the only registry serving this image
  # (rate-limited: pre-pull before a demo with `docker compose --profile llm up ollama-pull`).
  ollama:
    image: &ollama-image docker.io/ollama/ollama@sha256:ccc42bcd3d5fcf7ab0d532b300382154e1a4da56fc666bdb313b78ebdd912754
    profiles: [llm]
    restart: unless-stopped
    volumes:
      - ollama_models:/root/.ollama
    # /v1 cannot set num_ctx per request: a small default context silently truncates a stage-2 chunk.
    # Two models (gemma3:4b for stage 2, bge-m3 for embeddings, ADR 0313) stay loaded side by side through
    # a demo instead of evicting each other on every document.
    environment:
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-8192}
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-2}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
    networks: [data]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
    deploy:
      resources:
        limits: { cpus: "4.0", memory: 6G }

  # One-shot on egress only: runs its own loopback-only server on the shared model volume, pulls every
  # model in OLLAMA_PULL_MODELS (space-separated; not OLLAMA_MODELS, which Ollama reads as its storage
  # directory), exits. Nothing else can reach it, and the serving `ollama`
  # above never gets internet.
  ollama-pull:
    image: *ollama-image
    profiles: [llm]
    restart: "no"
    entrypoint:
      - /bin/sh
      - -c
      - |
        ollama serve >/tmp/serve.log 2>&1 &
        i=0; until ollama list >/dev/null 2>&1; do i=$$((i + 1)); [ $$i -lt 60 ] || { cat /tmp/serve.log; exit 1; }; sleep 1; done
        for m in $$OLLAMA_PULL_MODELS; do ollama pull "$$m" || exit 1; done
    environment:
      OLLAMA_HOST: 127.0.0.1:11434
      OLLAMA_PULL_MODELS: ${OLLAMA_PULL_MODELS:-gemma3:4b bge-m3}
    volumes:
      - ollama_models:/root/.ollama
    networks: [egress]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 2G }

  gateway:
    image: public.ecr.aws/docker/library/caddy:2-alpine
    restart: unless-stopped
    environment:
      IW_HOSTNAME: ${IW_HOSTNAME:-localhost}
      IW_HTTPS_PORT: ${IW_HTTPS_PORT:-8443}
      IW_HSTS: ${IW_HSTS:-max-age=0}
      API_UPSTREAM: ${API_UPSTREAM:-api:8000}
      WEB_UPSTREAM: ${WEB_UPSTREAM:-web:8080}
    ports:
      - "127.0.0.1:${IW_HTTPS_PORT:-8443}:8443"
      - "127.0.0.1:${IW_HTTP_PORT:-8080}:8080"
    volumes:
      - ./gateway/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 128M }

volumes:
  pgdata:
  redisdata:
  miniodata:
  ollama_models:
  caddy_data:
  caddy_config:

# Names are project-scoped (<project>_edge, <project>_data), so stacks from parallel worktrees
# (different COMPOSE_PROJECT_NAME) never share a network or a service DNS name.
networks:
  edge: {}
  # No route outside: Postgres, Redis, object storage and Ollama, plus the modules that use them.
  data:
    internal: true
  # Outbound internet for the services that need it (scraper, analytics' hosted LLM, the Ollama model pull).
  # Separate from edge, so "who can reach the internet" is visible from the network list.
  egress: {}
