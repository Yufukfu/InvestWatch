# Static SPA server. Plain HTTP inside the private network; TLS terminates at the gateway (HSTS is set there).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Hashed assets: cache forever.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # No dotfiles (.env, .git) ever.
    location ~ /\. {
        include /etc/nginx/snippets/security-headers.conf;
        deny all;
    }

    # SPA fallback; index.html is never cached so a deploy takes effect immediately.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ /index.html;
    }
}
