# web/ deployment unit. Runs on its own (docker compose -f web/compose.yaml up) or through the root compose.yaml.
# Only reachable through the gateway: no host port is published.
services:
  web:
    build: .
    image: investwatch/web:${IW_VERSION:-dev}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [edge]
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 128M }

# Project-scoped: <project>_edge. Run alone with the stack's project name:
#   docker compose -p investwatch --env-file .env -f web/compose.yaml up
networks:
  edge: {}
