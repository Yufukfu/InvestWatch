# web/ deployment unit. Runs through the root compose.yaml, or on its own with the stack's project name
# (docker compose -p investwatch --env-file .env -f web/compose.yaml up) so it joins <project>_edge.
# Only reachable through the gateway: no host port is published.
services:
  web:
    build: .
    # Tag per compose project (issue #63): two checkouts never run each other's image. IW_VERSION names a release.
    # pull_policy: build rebuilds on every `up` (cached layers), so a failed build stops `up` instead of starting
    # the last image; `--no-build` is the explicit way to start the existing one.
    pull_policy: build
    image: investwatch/web:${IW_VERSION:-${COMPOSE_PROJECT_NAME:-dev}}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [edge]
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 128M }

# Project-scoped: <project>_edge. Run alone with the stack's project name:
#   docker compose -p investwatch --env-file .env -f web/compose.yaml up
networks:
  edge: {}
