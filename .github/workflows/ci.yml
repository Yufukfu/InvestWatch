name: ci

# Not a merge gate for now: manual only, to keep the 24h hackathon fast. Run it from the Actions tab
# before milestones and hand-in to get a recorded dependency audit (jury criterion).
# Later, as part of the full SDLC: add `pull_request` and `push: main` triggers and make the jobs
# required checks in branch protection.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  process:
    name: Specs and hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Hook and script tests
        run: node --test ".claude/hooks/*.test.js" ".claude/skills/iw-docs-update/scripts/*.test.mjs" ".claude/skills/iw-pr-review/scripts/*.test.mjs"
      - name: Docs check (paths, ADR index, service CLAUDE.md)
        run: node .claude/skills/iw-docs-update/scripts/docs-check.mjs
      - name: Validate OpenSpec specs and changes
        run: npx -y @fission-ai/openspec@2.1.1 validate --all --strict --no-interactive
        env:
          OPENSPEC_TELEMETRY: "0"

  python:
    name: Python services
    runs-on: ubuntu-latest
    # Throwaway services for the tests that need real PostgreSQL, Redis and MinIO. Each suite names its own
    # variables and decides whether a missing service skips or fails: api skips without `TEST_DATABASE_ADMIN_URL`,
    # analytics without `CONTRACTS_DIR`, the scraper tests read `IW_TEST_*` (they fail when `CI` is set, which GitHub
    # does on every runner) or `REDIS_URL`. Set here so none of them skips; `pytest -rs` lists any skip that still
    # happens. The values are test-only, not secrets.
    env:
      TEST_DATABASE_ADMIN_URL: postgresql://postgres:test@localhost:5432/postgres
      CONTRACTS_DIR: ${{ github.workspace }}/contracts
      REDIS_URL: redis://localhost:6379/0
      IW_TEST_PG_DSN: postgresql://postgres:test@localhost:5432/iw
      IW_TEST_REDIS_URL: redis://localhost:6379/0
      IW_TEST_MINIO_ENDPOINT: localhost:9000
      IW_TEST_MINIO_ACCESS_KEY: testuser
      IW_TEST_MINIO_SECRET_KEY: testpass-123456
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: iw
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d iw" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: public.ecr.aws/docker/library/redis:8-alpine@sha256:7958cfbb9d152f87dadfbc89f1b0b15938f0b81ff8982feb327476f4911935c3
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # `services:` cannot pass `server /data`, so MinIO is started here, on the digest the stack pins (PR #18).
      # Docker's port proxy accepts the connection and then resets it while MinIO starts, which curl only
      # retries with `--retry-all-errors` (`--retry-connrefused` covers refusals alone).
      - name: Start MinIO for tests
        run: |
          docker run -d --name iw-test-minio -p 9000:9000 \
            -e MINIO_ROOT_USER="$IW_TEST_MINIO_ACCESS_KEY" -e MINIO_ROOT_PASSWORD="$IW_TEST_MINIO_SECRET_KEY" \
            cgr.dev/chainguard/minio@sha256:e9cf6b99c226e9539ed0f14b6f00e37b07da153c7ba1f4f8709c807574b471ec server /data
          curl -fsS --retry 30 --retry-all-errors --retry-delay 1 --max-time 5 http://localhost:9000/minio/health/ready \
            || { docker logs iw-test-minio; exit 1; }
      - name: Test and audit each Python service that has a requirements.txt
        shell: bash
        run: |
          set -euo pipefail
          pip install pip-audit pytest
          for req in */requirements.txt; do
            [ -f "$req" ] || continue
            dir=$(dirname "$req")
            echo "::group::$dir"
            pip install -r "$req"
            pip-audit -r "$req"
            if [ -f "$dir/requirements-dev.txt" ]; then
              pip install -r "$dir/requirements-dev.txt"
              pip-audit -r "$dir/requirements-dev.txt"
            fi
            if [ -d "$dir/tests" ]; then (cd "$dir" && pytest -q -rs); fi
            echo "::endgroup::"
          done

  contracts:
    # Own job: the loop above only sees top-level */requirements.txt, so contracts/mock-server
    # is skipped there, and the mock server needs Python 3.13 (pyproject.toml).
    name: Contracts and mock server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate contracts (schemas, mocks, referential integrity, OpenAPI parse)
        run: |
          pip install -r contracts/requirements.txt
          python contracts/validate.py
      - name: Audit and test the mock server
        working-directory: contracts/mock-server
        run: |
          pip install -r requirements-dev.txt
          pip-audit -r requirements.txt -r requirements-dev.txt
          pytest -q

  node:
    name: Node services
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit, lint, typecheck and test each Node service that has a package-lock.json
        shell: bash
        run: |
          set -euo pipefail
          for lock in */package-lock.json; do
            [ -f "$lock" ] || continue
            dir=$(dirname "$lock")
            echo "::group::$dir"
            (cd "$dir" && npm ci && npm audit --audit-level=high && npm run lint --if-present && npm run typecheck --if-present && npm test --if-present)
            echo "::endgroup::"
          done

  no-debug-output:
    name: No console.log or tracked secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: console.log in non-test JS/TS
        shell: bash
        run: |
          hits=$(git grep -nE 'console\.log\s*\(' -- '*.js' '*.jsx' '*.ts' '*.tsx' ':!*.test.*' ':!*.spec.*' ':!.claude' ':!node_modules' || true)
          if [ -n "$hits" ]; then echo "$hits"; exit 1; fi
      - name: tracked .env files
        shell: bash
        run: |
          hits=$(git ls-files | grep -E '(^|/)\.env(\.[A-Za-z0-9_-]+)?$' | grep -vE '\.env\.(example|sample|template)$' || true)
          if [ -n "$hits" ]; then echo "$hits"; exit 1; fi
