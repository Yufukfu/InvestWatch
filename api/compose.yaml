# api/ deployment unit (owner Damian). Included from the root compose.yaml next to infra/compose.yaml, which owns
# the `postgres`, `redis` and `minio-init` services and the `data` and `edge` networks this file uses (so none of
# them is declared here).
# Without the root file, run it together with infra: docker compose -f infra/compose.yaml -f api/compose.yaml up
# api-migrate applies the shared schema once and exits; scraper, analytics and api start only after it:
#   depends_on:
#     api-migrate: { condition: service_completed_successfully }
services:
  api-migrate:
    build:
      context: ..
      dockerfile: api/Dockerfile
    # Tag per compose project, rebuilt on every `up` (issue #63; see web/compose.yaml).
    pull_policy: build
    image: investwatch/api:${IW_VERSION:-${COMPOSE_PROJECT_NAME:-dev}}
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    environment:
      # Admin role: DDL. Only this one-shot job gets it; services connect as the app role.
      DATABASE_ADMIN_URL: postgresql://${POSTGRES_ADMIN_USER:-iw_admin}:${POSTGRES_ADMIN_PASSWORD:?set POSTGRES_ADMIN_PASSWORD in .env (scripts/init-env.sh)}@postgres:5432/${POSTGRES_DB:-investwatch}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      postgres: { condition: service_healthy }
    networks: [data]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256M }

  # REST under /api and Socket.IO under /socket.io on :8000; reached only through the gateway (no host port).
  api:
    image: investwatch/api:${IW_VERSION:-${COMPOSE_PROJECT_NAME:-dev}}
    command: ["python", "-m", "investwatch_api"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_APP_USER:-iw_app}:${POSTGRES_APP_PASSWORD:?set POSTGRES_APP_PASSWORD in .env (scripts/init-env.sh)}@postgres:5432/${POSTGRES_DB:-investwatch}
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env (scripts/init-env.sh)}@redis:6379/0
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-iw-app}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?set MINIO_SECRET_KEY in .env (scripts/init-env.sh)}
      MINIO_BUCKET: ${MINIO_BUCKET:-iw-raw}
      MINIO_SECURE: ${MINIO_SECURE:-false}  # plain HTTP on the internal network
      # Same origin through the gateway needs nothing here; a list REPLACES that default (README).
      CORS_ORIGINS: ${API_CORS_ORIGINS:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      api-migrate: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    networks: [edge, data]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 384M }
