# Test harness for the scraper: the same Redis, PostgreSQL and MinIO images as the stack (infra/compose.yaml)
# plus the pytest image. Run from the repository root with its own project name and no host ports:
#   COMPOSE_PROJECT_NAME=iw-scraper-orch docker compose -f scraper/compose.test.yaml run --rm --build test
services:
  redis:
    image: public.ecr.aws/docker/library/redis:8-alpine@sha256:7958cfbb9d152f87dadfbc89f1b0b15938f0b81ff8982feb327476f4911935c3
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 2s
      retries: 20
  postgres:
    image: public.ecr.aws/docker/library/postgres:17-alpine
    environment:
      POSTGRES_DB: test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d test"]
      interval: 1s
      timeout: 2s
      retries: 30
  minio:
    image: cgr.dev/chainguard/minio@sha256:e9cf6b99c226e9539ed0f14b6f00e37b07da153c7ba1f4f8709c807574b471ec
    command: ["server", "/data", "--address", ":9000"]
    environment:
      MINIO_ROOT_USER: test-access
      MINIO_ROOT_PASSWORD: test-secret-key
      MINIO_BROWSER: "off"
    tmpfs: [/data]
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /minio/health/live HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          read -r status <&3 && [[ $$status == *' 200'* ]]
      interval: 2s
      timeout: 3s
      retries: 30
  # Only for tests/test_e2e_render.py: the real renderer plus the demo pages, address check off (tests_renderer/e2e_server.py).
  #   docker compose -f scraper/compose.test.yaml --profile e2e up -d --build renderer-e2e
  renderer-e2e:
    profiles: [e2e]
    build:
      context: ../scraper
      target: renderer-test
    command: ["python", "tests_renderer/e2e_server.py"]
    shm_size: 256m
    extra_hosts: ["xtb.demo.test:127.0.0.1", "mbank.demo.test:127.0.0.1"]
    volumes:
      - ./tests/fixtures/demo:/app/scraper/tests/fixtures/demo:ro
  test:
    build:
      context: ../scraper
      target: test
      additional_contexts:
        contracts: ../contracts
    environment:
      REDIS_URL: redis://redis:6379/0
      IW_TEST_REDIS_URL: redis://redis:6379/1
      IW_TEST_PG_DSN: postgresql://test:test@postgres:5432/test
      IW_TEST_MINIO_ENDPOINT: minio:9000
      IW_TEST_MINIO_ACCESS_KEY: test-access
      IW_TEST_MINIO_SECRET_KEY: test-secret-key
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
      minio: { condition: service_healthy }
    volumes:
      - ./src:/app/scraper/src:ro
      - ./tests:/app/scraper/tests:ro
