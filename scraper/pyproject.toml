[project]
name = "iw-scraper"
version = "0.1.0"
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["scraper_live: hits the real network, deselected by default"]
addopts = "-m 'not scraper_live'"
