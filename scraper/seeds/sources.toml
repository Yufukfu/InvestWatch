# The vetted web sources the scraper starts with (OpenSpec change scraper-v2-sources, design.md decision 9).
# Loaded by `python -m iw_scraper.seed`; a source whose URL is already in `sources` is left alone.
# Every URL is the final one (no redirect) and was fetched with our engine: HTTP 200, robots allowed, static text.
# `scraper/tests/test_seed_live.py` re-checks that on demand. schedule_cron is UTC; the XTB rows are staggered by
# minute so one domain's concurrency cap and request interval are not hit at once.
# No entry says that a named business breaks a rule: a row is a page that matches a signal, a negative control
# (a page that should NOT raise a finding) or a list page.

# --- M2: pages published by KNF-registered firms (rendered and checked by scraper-v3-render) ---

[[source]]
name = "XTB IKE"
url = "https://www.xtb.com/pl/ike"
source_kind = "firm_own"
target_modules = ["M2"]
schedule_cron = "0 6 * * *"

[[source]]
name = "XTB IKZE"
url = "https://www.xtb.com/pl/ikze"
source_kind = "firm_own"
target_modules = ["M2"]
schedule_cron = "10 6 * * *"

[[source]]
name = "XTB forex (CFD)"
url = "https://www.xtb.com/pl/forex"
source_kind = "firm_own"
target_modules = ["M2"]
schedule_cron = "20 6 * * *"

