# M3 signals: offers that may indicate investment advice (art. 76 u.o.i.f.: a recommendation based on the
# client's situation AND concerning financial instruments of art. 2-3) by entities outside the KNF registry.
# Challenge output: "dane podmiotu, treść oferty oraz lokalizację (URL)".
# `fail` = the signal is present. score = σ(bias + Σ weight·x), x: fail 1, uncertain 0.5, else 0, then
# capped at 0.4 unless S3.4 is fail or uncertain (modules/m3.py; design decision 8).
# Weights are hand-tuned starting values (design decision 10). Patterns are Python regexes, matched
# case-insensitively against the ORIGINAL text. `llm:` blocks follow the analytics-llm-p0 seam.
bias: -3.0
rules:
  - id: S3.1
    name: Podmiot nieznaleziony w rejestrze
    severity: high
    legal_basis: null
    weight: 0.5
    implemented: true

  - id: S3.2
    name: Słownictwo usług doradczych
    severity: medium
    legal_basis: null
    weight: 1.0
    implemented: true
    params:
      phrase_patterns:
        - '(?<!\w)family\s+office(?!\w)'
        - '(?<!\w)wealth\s+management(?!\w)'
        - '(?<!\w)doradztw\w*\s+inwestycyjn\w*'
        - '(?<!\w)doradc\w*\s+inwestycyjn\w*'
        - '(?<!\w)zarządzani\w*\s+portfel\w*'
        - '(?<!\w)indywidualn\w*\s+strategi\w*'
        - '(?<!\w)investment\s+advi[cs]\w*'
        # The challenge's own terms (p.1: "wealth management, investment consulting, family offices").
        - '(?<!\w)investment\s+consult\w*'
        - '(?<!\w)wealth\s+advis\w*'
        - '(?<!\w)doradztw\w*\s+finansow\w*'
        - '(?<!\w)zarządzani\w*\s+majątk\w*'

  - id: S3.3
    name: Personalizacja
    severity: high
    legal_basis: art. 76 u.o.i.f. (załącznik do tematu 3)
    weight: 1.5
    implemented: true
    params:
      phrase_patterns:
        - '(?<!\w)dopasuj\w*\s+(?:\w+\s+){0,3}do\s+(?:Twojej|twojej|Pana|Pani|Państwa)\s+sytuacji(?!\w)'
        - '(?<!\w)konsultacj\w*\s+1\s?:\s?1(?!\w)'
        - '(?<!\w)profil\w*\s+inwestycyjn\w*'
        # Not a bare "ankieta": a broker's MiFID onboarding questionnaire is the firm's, not advice.
        - '(?<!\w)ankiet\w*\s+(?:inwestycyjn\w*|o\s+(?:Twoich|twoich|Twojej|twojej)\s+(?:celach|sytuacji|finansach))'
        - '(?<!\w)indywidualnie\s+dobier\w*'
        - '(?<!\w)szyt\w*\s+na\s+miarę(?!\w)'
    llm:
      when: uncertain
      question: >-
        Czy oferta dopasowuje rekomendacje do sytuacji konkretnego klienta (profil, ankieta, konsultacja
        indywidualna) i czy jest to oferta autora materiału? fail = tak, pass = nie. Zacytuj zdanie.

  - id: S3.4
    name: Rekomendacja konkretnych instrumentów
    severity: high
    legal_basis: art. 76 u.o.i.f. (załącznik do tematu 3)
    weight: 3.0
    implemented: true
    params:
      verb_patterns: &verbs
        # Recommending forms only (imperatives, "rekomendujemy", "warto kupić"); a descriptive present tense
        # ("inwestorzy kupują") or a first-person past ("kupiłam") is not a recommendation.
        - '(?<!\w)kup(?:cie)?(?!\w)'
        - '(?<!\w)kupuj(?:cie)?(?!\w)'
        - '(?<!\w)kupn\w+'
        - '(?<!\w)sprzedaj(?:cie)?(?!\w)'
        - '(?<!\w)sprzedawaj(?:cie)?(?!\w)'
        - '(?<!\w)sprzedaż\w*'
        - '(?<!\w)trzymaj(?:cie)?(?!\w)'
        - '(?<!\w)zainwestuj(?:cie)?\s+w(?!\w)'
        - '(?<!\w)rekomend(?:ujemy|uję|uje)(?!\w)'
        - '(?<!\w)polec(?:am|amy)\s+(?:kupić|kupno|sprzedać|sprzedaż)\w*'
        - '(?<!\w)polec(?:am|amy)\s+(?=akcj|obligacj|ETF|CFD|kontrakt|certyfikat)'
        - '(?<!\w)warto\s+(?:kupić|sprzedać|trzymać)(?!\w)'
        - '(?<!\w)co\s+(?:kupić|sprzedać)(?!\w)'
      instrument_patterns: &instruments
        - '(?<!\w)akcj\w*(?!\w)(?!\s+promocyj)'
        - '(?<!\w)obligacj\w*'
        - '(?<!\w)ETF\w*'
        - '(?<!\w)CFD(?!\w)'
        # Plural options only: "opcja roczna" (a plan) is not an instrument.
        - '(?<!\w)opcj(?:e|i|ach|ami|om)(?!\w)(?!\s+(?:dostawy|płatności|abonamentu))'
        - '(?<!\w)kontrakt\w*\s+terminow\w*'
        - '(?<!\w)futures(?!\w)'
        - '(?<!\w)certyfikat\w*\s+(?:inwestycyjn|strukturyzowan|turbo)\w*'
        - '(?<!\w)jednost\w*\s+(?:uczestnictwa|funduszy?)\w*'
      negation_patterns: &negations
        # Stops at a comma or semicolon, so "nie rekomendujemy X, ale kupuj ETF" keeps the second call.
        - '(?<!\w)nie\s+(?:udzielamy|udzielam|dajemy|polecamy|polecam|rekomendujemy|rekomenduję)\b[^.!?,;]*'
      window: 1
    llm:
      when: uncertain
      question: >-
        Czy autor materiału rekomenduje nabycie, zbycie albo trzymanie konkretnych instrumentów finansowych
        (akcje, obligacje, ETF, CFD, opcje, kontrakty terminowe, certyfikaty, jednostki funduszy)?
        fail = tak, pass = nie. Zacytuj zdanie z rekomendacją.

  - id: S3.5
    name: Model odpłatny
    severity: medium
    legal_basis: null
    weight: 1.0
    implemented: true
    params:
      phrase_patterns:
        - '(?<!\w)abonament\w*'
        - '(?<!\w)subskrypcj\w*'
        - '(?<!\w)sygnał\w*\s+premium(?!\w)'
        - '(?<!\w)VIP(?!\w)'
        - '(?<!\w)płatn\w*\s+grup\w*'
        # Bounded number part, as in S3.6 (ReDoS, whole-branch review).
        - '(?<![\d.,])\d(?:[\d.,]|\s(?=\d)){0,24}\s?(?:zł|PLN)\s?/\s?mies\w*'
        - '(?<![\d.,])\d(?:[\d.,]|\s(?=\d)){0,24}\s?(?:zł|PLN)\s+miesięcznie(?!\w)'
        # English pricing (#35 review): "2000 PLN per month", "49 EUR/month", "$99 monthly", a subscription.
        - '(?<![\d.,])\d(?:[\d.,]|\s(?=\d)){0,24}\s?(?:zł|PLN|EUR|USD|€|\$)\s?(?:/\s?(?:month|mo)(?!\w)|per\s+month(?!\w)|a\s+month(?!\w)|monthly(?!\w))'
        - '(?<![\w$€])[$€]\s?\d[\d.,]{0,12}\s?(?:/\s?(?:month|mo)(?!\w)|per\s+month(?!\w)|a\s+month(?!\w)|monthly(?!\w))'
        - '(?<!\w)subscriptions?(?!\w)'
        - '(?<!\w)monthly\s+(?:fee|plan|membership)s?(?!\w)'

  - id: S3.6
    name: Kierowanie do Polski
    severity: low
    legal_basis: null
    weight: 0.5
    implemented: true
    params:
      currency_patterns:
        - '(?<![\d.,])\d(?:[\d.,]|\s(?=\d)){0,24}\s?(?:(?:tys|mln|mld)\.?\s?)?(?:zł(?:ot\w*)?|zl|PLN)(?!\w)'
        - '(?<!\w)PLN\s?\d'
      phone_patterns:
        - '\+48[\s-]?\d{2,3}[\s-]?\d{2,3}[\s-]?\d{2,3}'
      pl_domain_suffixes: [.pl]

  - id: S3.7
    name: Lista ostrzeżeń publicznych KNF
    severity: medium
    legal_basis: null
    weight: 1.0
    implemented: false

  - id: S3.8
    name: Rekomendacje kryptoaktywów (poza art. 2)
    severity: low
    legal_basis: art. 2 u.o.i.f. (załącznik do tematu 3)
    weight: 0.5
    implemented: true
    params:
      verb_patterns: *verbs
      instrument_patterns: *instruments
      negation_patterns: *negations
      crypto_patterns:
        - '(?<!\w)bitcoin\w*'
        - '(?<!\w)BTC(?!\w)'
        - '(?<!\w)ethereum\w*'
        - '(?<!\w)ETH(?!\w)'
        - '(?<!\w)kryptowalut\w*'
        - '(?<!\w)altcoin\w*'
      window: 1
