# Seed phrases per positive class for the (stretch) similarity rescue: centroids = normalized means.
centroids:
  investment_offer:
    - Zainwestuj i zarabiaj co miesiąc bez ryzyka
    - Gwarantowany zysk z inwestycji, dołącz już dziś
    - Pomnóż swoje oszczędności dzięki naszej platformie
  finfluencer:
    - Moje portfolio i wyniki z tego tygodnia
    - Darmowe sygnały na dziś, kopiuj moje transakcje
    - Jak zarobiłem pierwszy milion na giełdzie
  advisory_service:
    - Pomogę Ci pomnożyć oszczędności, napisz na priv
    - Indywidualne doradztwo, które spółki kupić teraz
    - Zapisz się do grupy VIP z poradami inwestycyjnymi
