# Investment topic gate vocabulary (analytics-embeddings; ADR 0314; .docs/analytics-plan.md §2 step 2).
# Data, not code. Matching is case- and diacritic-insensitive (write terms without Polish diacritics) and on
# word boundaries. A trailing `*` makes a word a stem (`zysk*` matches zysk, zyski, zyskow). A phrase is
# words separated by one space; each word may be a stem. `prefixes` may precede any stem (zainwestuj).
# The gate drops a document only when nothing here matches: keep the list broad (recall first).
version: 1
prefixes: [za, po, wy]
terms:
