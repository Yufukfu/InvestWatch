# analytics/ deployment unit: the iw:documents stream worker and the one-shot gold-set evaluation. Included from the root compose.yaml
# next to infra/compose.yaml, which owns postgres, redis and the data network (none is declared here),
# and api/compose.yaml, whose one-shot api-migrate creates the tables this worker reads and writes.
# Without the root file: docker compose -f infra/compose.yaml -f api/compose.yaml -f analytics/compose.yaml up analytics
services:
  analytics:
    # ../analytics, not `.`: with several -f files Compose resolves paths from the first file's directory (infra/ in
    # the command above); from analytics/ (root include) it is the same directory. api-migrate uses `..` likewise.
    build: ../analytics
    # Tag per compose project, rebuilt on every `up` (issue #63; see web/compose.yaml).
    pull_policy: build
    image: investwatch/analytics:${IW_VERSION:-${COMPOSE_PROJECT_NAME:-dev}}
    restart: unless-stopped
    environment:
      # App role: CRUD only, no DDL (infra/postgres/init/01-app-role.sh).
      DATABASE_URL: postgresql://${POSTGRES_APP_USER:-iw_app}:${POSTGRES_APP_PASSWORD:?set POSTGRES_APP_PASSWORD in .env (scripts/init-env.sh)}@postgres:5432/${POSTGRES_DB:-investwatch}
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env (scripts/init-env.sh)}@redis:6379/0
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      HEALTH_PORT: "8001"
      # LLM (ADR 0304, 0318), from the root .env; empty LLM_BASE_URL = rules-only (model.llm = null). Default: hosted
      # DeepSeek Flash (OpenAI-compatible endpoint, mentor exception; Gemma 4 on the Gemini API is the documented
      # alternative, ADR 0317); local swap target: LLM_BASE_URL=http://ollama:11434/v1,
      # LLM_MODEL=gemma3:4b, LLM_API_KEY=ollama with --profile llm. Limits: analytics/.env.example.
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_TIMEOUT_S: ${LLM_TIMEOUT_S:-}
      LLM_DOC_BUDGET_S: ${LLM_DOC_BUDGET_S:-}
      LLM_CHUNK_CHARS: ${LLM_CHUNK_CHARS:-}
      LLM_MAX_CHUNKS: ${LLM_MAX_CHUNKS:-}
      LLM_CACHE_TTL_S: ${LLM_CACHE_TTL_S:-}
      LLM_BREAKER_FAILURES: ${LLM_BREAKER_FAILURES:-}
      LLM_BREAKER_COOLDOWN_S: ${LLM_BREAKER_COOLDOWN_S:-}
      # Embeddings (ADR 0313): local only. Empty EMBED_BASE_URL = off (model.embedder = null, dictionary-only gate).
      # With --profile llm and bge-m3 pulled (issue #65): EMBED_BASE_URL=http://ollama:11434/v1. Limits: analytics/.env.example.
      EMBED_BASE_URL: ${EMBED_BASE_URL:-}
      EMBED_MODEL: ${EMBED_MODEL:-bge-m3}
      EMBED_API_KEY: ${EMBED_API_KEY:-}
      EMBED_DIM: ${EMBED_DIM:-}
      EMBED_TIMEOUT_S: ${EMBED_TIMEOUT_S:-}
      EMBED_MAX_CHARS: ${EMBED_MAX_CHARS:-}
      EMBED_CACHE_TTL_S: ${EMBED_CACHE_TTL_S:-}
      EMBED_BREAKER_FAILURES: ${EMBED_BREAKER_FAILURES:-}
      EMBED_BREAKER_COOLDOWN_S: ${EMBED_BREAKER_COOLDOWN_S:-}
      # Topic gate and near-duplicates (ADR 0314); defaults in analytics/.env.example.
      GATE_ENABLED: ${GATE_ENABLED:-}
      GATE_EMBED_MIN_MARGIN: ${GATE_EMBED_MIN_MARGIN:-}
      GATE_EMBED_MIN_CHARS: ${GATE_EMBED_MIN_CHARS:-}
      NEARDUP_NUM_PERM: ${NEARDUP_NUM_PERM:-}
      NEARDUP_BANDS: ${NEARDUP_BANDS:-}
      NEARDUP_THRESHOLD: ${NEARDUP_THRESHOLD:-}
      NEARDUP_MAX_CHARS: ${NEARDUP_MAX_CHARS:-}
      NEARDUP_TTL_S: ${NEARDUP_TTL_S:-}
      # Must stay above (LLM_DOC_BUDGET_S + 3 s + EMBED_TIMEOUT_S) * 1000 (the worker refuses to start otherwise);
      # 120000 for hosted DeepSeek Flash (ADR 0318), 90000 for hosted Gemma.
      CLAIM_MIN_IDLE_MS: ${CLAIM_MIN_IDLE_MS:-}
      # Registry: empty = the bundled real KNF register snapshot, registry/knf.csv (749 firms; the worker logs its
      # snapshot date as registry_loaded). registry/seed.csv is the fictional test fixture (registry_seed WARNING).
      # Format and refresh: analytics/registry/README.md.
      REGISTRY_CSV: ${REGISTRY_CSV:-}
      # Optional tuning, defaults in analytics/.env.example: WORKER_CONSUMER (hostname), STREAM_BLOCK_MS,
      # CLAIM_MIN_IDLE_MS, MAX_DELIVERIES, MAX_DOCUMENT_BYTES.
    depends_on:
      api-migrate: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      # Makes `up --wait` check the one-shot for completion, as it does for api-migrate. A service nobody depends on is
      # checked for "running or healthy", and a finished one-shot fails that ("no healthcheck configured" while it
      # runs, "exited (0)" once done). required: false still starts the worker if the evaluation fails; --wait then
      # exits 1 with "didn't complete successfully". Delays the worker only by the evaluation run (seconds).
      analytics-eval: { condition: service_completed_successfully, required: false }
    # data: Postgres, Redis and the optional ollama service (internal, no route out). egress: the hosted LLM endpoint
    # (ADR 0304), added together with the LLM client in analytics-llm-p0. Network keys only, never `name:`.
    networks: [data, egress]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }

  # One-shot gold-set evaluation (change analytics-eval-calibration, ADR 0312): fills calibration_points so the
  # calibration panel has a curve after a plain `docker compose up`. Rules-only and deterministic; it writes a module's
  # run only when the gold set, the pipeline version or the results changed, so restarts add nothing.
  # Manual re-run: docker compose run --rm analytics-eval  (or: python analytics/eval/run.py --db).
  # No `build:` here: `analytics` builds the shared image (like api-migrate/api). Two services building one tag run
  # two parallel exports, and with the containerd image store one fails "image ... already exists", aborting `up --build`.
  analytics-eval:
    image: investwatch/analytics:${IW_VERSION:-${COMPOSE_PROJECT_NAME:-dev}}
    command: ["python", "-m", "investwatch_analytics.evaluation", "--db"]
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_APP_USER:-iw_app}:${POSTGRES_APP_PASSWORD:?set POSTGRES_APP_PASSWORD in .env (scripts/init-env.sh)}@postgres:5432/${POSTGRES_DB:-investwatch}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      api-migrate: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
    # data only: Postgres. No Redis, no egress (no LLM in the default run).
    networks: [data]
    # The image's HEALTHCHECK polls the worker's /health; a one-shot job has none. `up --wait` checks this service
    # for completion because `analytics` depends on it (see there), so it does not need a healthcheck.
    healthcheck:
      disable: true
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 256M }
