openapi: 3.1.0
info:
  title: InvestWatch API
  version: 1.3.0
  description: |
    REST API between the `api` service (owner: C) and the dashboard (owner: B).
    Real-time events are delivered over Socket.IO (namespace `/events`), see `schemas/events.schema.json`.
    Mock responses for every endpoint are in `mocks/`.
servers:
  - url: http://localhost:8000/api
    description: Local docker-compose
tags:
  - name: findings
  - name: stats
  - name: calibration
  - name: settings
  - name: sources
  - name: documents
  - name: system

paths:
  /findings:
    get:
      tags: [findings]
      summary: List findings
      description: Sorted by `detected_at` descending unless `sort` is given. Each item includes the derived `risk_level`.
      parameters:
        - { name: module, in: query, schema: { type: string, enum: [M1, M2, M3] } }
        - { name: status, in: query, description: Comma-separated list, schema: { type: string, example: "new,in_review" } }
        - { name: platform, in: query, schema: { type: string } }
        - { name: source_id, in: query, schema: { type: string, format: uuid } }
        - { name: document_id, in: query, description: Only the findings of this document (at most one per module). Combines with the other filters and pagination. Added in 1.1.0, schema: { type: string, format: uuid } }
        - { name: risk_level, in: query, schema: { type: string, enum: [high, medium, low] } }
        - { name: score_min, in: query, schema: { type: number, minimum: 0, maximum: 1 } }
        - { name: date_from, in: query, schema: { type: string, format: date-time } }
        - { name: date_to, in: query, schema: { type: string, format: date-time } }
        - { name: q, in: query, description: Full-text search in title, excerpt, firm and advertiser, schema: { type: string } }
        - { name: sort, in: query, schema: { type: string, enum: [detected_at, -detected_at, score, -score], default: -detected_at } }
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/page_size'
      responses:
        '200':
          description: Page of findings (mock `mocks/findings.json`)
          content:
            application/json:
              schema:
                type: object
                required: [items, total, page, page_size]
                properties:
                  items: { type: array, items: { $ref: './schemas/finding.schema.json' } }
                  total: { type: integer }
                  page: { type: integer }
                  page_size: { type: integer }

  /findings/export:
    get:
      tags: [findings]
      summary: Report export of the filtered findings list (CSV)
      description: |
        The findings that `GET /findings` would return for the same filters and `sort`, without pagination,
        as a CSV attachment (UTF-8 with BOM, comma-separated, one header row), at most 10 000 rows (issue #115).
        `X-Total-Count` holds the number of matches; `X-Export-Truncated` is `true` when rows were cut.
        A text cell starting with `=`, `+`, `-`, `@`, a tab or a carriage return is prefixed with `'`.
        Columns: id, detected_at, module, risk_level, score, status, platform, title, firm_name,
        firm_registry_id, advertiser_name, advertiser_handle, url, failed_rules (space-separated rule ids), note.
        Added in 1.3.0.
      parameters:
        - { name: module, in: query, schema: { type: string, enum: [M1, M2, M3] } }
        - { name: status, in: query, description: Comma-separated list, schema: { type: string, example: "new,in_review" } }
        - { name: platform, in: query, schema: { type: string } }
        - { name: source_id, in: query, schema: { type: string, format: uuid } }
        - { name: document_id, in: query, schema: { type: string, format: uuid } }
        - { name: risk_level, in: query, schema: { type: string, enum: [high, medium, low] } }
        - { name: score_min, in: query, schema: { type: number, minimum: 0, maximum: 1 } }
        - { name: date_from, in: query, schema: { type: string, format: date-time } }
        - { name: date_to, in: query, schema: { type: string, format: date-time } }
        - { name: q, in: query, schema: { type: string } }
        - { name: sort, in: query, schema: { type: string, enum: [detected_at, -detected_at, score, -score], default: -detected_at } }
        - { name: format, in: query, schema: { type: string, enum: [csv], default: csv } }
      responses:
        '200':
          description: CSV attachment
          headers:
            X-Total-Count: { schema: { type: integer }, description: Number of matching findings }
            X-Export-Truncated: { schema: { type: string, enum: ['true', 'false'] }, description: Rows were cut at 10 000 }
          content:
            text/csv:
              schema: { type: string }
        '422': { $ref: '#/components/responses/ValidationError' }

  /findings/bulk-status:
    post:
      tags: [findings]
      summary: Set one status on several findings
      description: |
        Applies `{status}` as `PATCH /findings/{id}` does to every existing id, in one transaction, and emits one
        `finding.updated` per updated finding over Socket.IO. Unknown ids are reported, not an error (issue #115).
        `results` has one entry per requested id, in request order. Added in 1.3.0.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids, status]
              additionalProperties: false
              properties:
                ids: { type: array, items: { type: string, format: uuid }, minItems: 1, maxItems: 200, uniqueItems: true }
                status: { type: string, enum: [new, in_review, confirmed, false_positive, closed] }
      responses:
        '200':
          description: Per-item results
          content:
            application/json:
              schema:
                type: object
                required: [updated, not_found, results]
                properties:
                  updated: { type: integer }
                  not_found: { type: integer }
                  results:
                    type: array
                    items:
                      type: object
                      required: [id, result, finding]
                      properties:
                        id: { type: string, format: uuid }
                        result: { type: string, enum: [updated, not_found] }
                        finding:
                          description: The updated finding with `risk_level`; null when not found
                          oneOf:
                            - $ref: './schemas/finding.schema.json'
                            - { type: 'null' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /findings/{id}:
    parameters:
      - $ref: '#/components/parameters/id'
    get:
      tags: [findings]
      summary: Finding details with its document
      responses:
        '200':
          description: Mock `mocks/finding-detail.json`
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './schemas/finding.schema.json'
                type: object
                properties:
                  document:
                    $ref: './schemas/scraped-document.schema.json'
                  screenshot_urls:
                    type: object
                    description: API URLs for the screenshots, keyed by viewport
                    additionalProperties: { type: string }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [findings]
      summary: Change status / add a note
      description: Emits `finding.updated` over Socket.IO.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              additionalProperties: false
              properties:
                status: { type: string, enum: [new, in_review, confirmed, false_positive, closed] }
                note: { type: [string, 'null'] }
      responses:
        '200':
          description: Updated finding
          content:
            application/json:
              schema: { $ref: './schemas/finding.schema.json' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /findings/{id}/export:
    parameters:
      - $ref: '#/components/parameters/id'
    get:
      tags: [findings]
      summary: Evidence pack (case file) of one finding
      description: |
        Read-only case file for supervisory follow-up (issue #70): the finding with its scores, model and rules,
        the document as stored (URL, `content_hash`, `fetched_at`, text), the raw HTML from object storage
        (`iw-raw`, key `html_object_key`) with its SHA-256, the screenshot URLs and the failed rules with their
        legal basis and verified quotes. `format=html` returns the same content as a printable page in Polish,
        with all scraped text escaped. Added in 1.2.0.
      parameters:
        - { name: format, in: query, schema: { type: string, enum: [json, html], default: json } }
      responses:
        '200':
          description: The evidence pack (JSON), or a printable HTML page when `format=html`
          content:
            application/json:
              schema:
                type: object
                required: [export_version, generated_at, finding, document, raw, screenshot_urls, failed_rules]
                properties:
                  export_version: { type: string, const: '1' }
                  generated_at: { type: string, format: date-time }
                  finding: { $ref: './schemas/finding.schema.json' }
                  document:
                    description: The stored document; null when the row is gone
                    oneOf:
                      - $ref: './schemas/scraped-document.schema.json'
                      - type: 'null'
                  raw:
                    type: object
                    description: Raw HTML from object storage. `available` is false when there is no key, no object or the store is down
                    required: [object_key, available]
                    properties:
                      object_key: { type: [string, 'null'] }
                      available: { type: boolean }
                      unavailable_reason: { type: [string, 'null'], enum: [no_key, not_found, store_down, null] }
                      sha256: { type: [string, 'null'], pattern: '^[0-9a-f]{64}$' }
                      size_bytes: { type: [integer, 'null'], minimum: 0 }
                      truncated: { type: boolean, description: true when `html` holds only the first 2 MB }
                      html: { type: [string, 'null'] }
                  screenshot_urls:
                    type: object
                    description: API URLs for the screenshots, keyed by viewport (as on the finding detail)
                    additionalProperties: { type: string }
                  failed_rules:
                    type: array
                    description: The finding's rules with `result` fail, in stored order
                    items: { $ref: './schemas/finding.schema.json#/$defs/rule_result' }
            text/html:
              schema: { type: string }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /stats/trend:
    get:
      tags: [stats]
      summary: Number of findings over time per module
      parameters:
        - { name: module, in: query, schema: { type: string, enum: [M1, M2, M3] } }
        - { name: bucket, in: query, schema: { type: string, enum: [hour, day], default: hour } }
        - { name: risk_level, in: query, schema: { type: string, enum: [high, medium, low] } }
        - { name: date_from, in: query, schema: { type: string, format: date-time } }
        - { name: date_to, in: query, schema: { type: string, format: date-time } }
      responses:
        '200':
          description: Mock `mocks/trend.json`
          content:
            application/json:
              schema:
                type: object
                required: [bucket, points]
                properties:
                  bucket: { type: string, enum: [hour, day] }
                  points:
                    type: array
                    items:
                      type: object
                      required: [t, M1, M2, M3]
                      properties:
                        t: { type: string, format: date-time }
                        M1: { type: integer }
                        M2: { type: integer }
                        M3: { type: integer }

  /stats/summary:
    get:
      tags: [stats]
      summary: Counters for the dashboard header
      responses:
        '200':
          description: Mock `mocks/summary.json`
          content:
            application/json:
              schema:
                type: object
                required: [total, by_module, by_status, by_platform, by_risk_level]
                properties:
                  total: { type: integer }
                  by_module: { type: object, additionalProperties: { type: integer } }
                  by_status: { type: object, additionalProperties: { type: integer } }
                  by_platform: { type: object, additionalProperties: { type: integer } }
                  by_risk_level: { type: object, additionalProperties: { type: integer } }
                  last_scan_at: { type: [string, 'null'], format: date-time }
                  m2_coverage:
                    type: object
                    description: |
                      M2 findings (`total`) and those matched to a KNF register entry, i.e. with `firm.registry_id`
                      set (`registry_matched`), for the dashboard's coverage strip. Added in 1.3.0.
                    required: [total, registry_matched]
                    properties:
                      total: { type: integer }
                      registry_matched: { type: integer }

  /calibration:
    get:
      tags: [calibration]
      summary: Precision/recall curve for the threshold slider
      description: Computed from analyst labels (confirmed / false_positive) and the gold set.
      parameters:
        - { name: module, in: query, required: true, schema: { type: string, enum: [M1, M2, M3] } }
      responses:
        '200':
          description: Mock `mocks/calibration-M2.json`
          content:
            application/json:
              schema:
                type: object
                required: [module, current_threshold, labeled_samples, points]
                properties:
                  module: { type: string, enum: [M1, M2, M3] }
                  current_threshold: { type: number }
                  labeled_samples: { type: integer }
                  points:
                    type: array
                    items:
                      type: object
                      required: [threshold, tp, fp, fn, tn, precision, recall]
                      properties:
                        threshold: { type: number }
                        tp: { type: integer }
                        fp: { type: integer }
                        fn: { type: integer }
                        tn: { type: integer }
                        precision: { type: number }
                        recall: { type: number }
                        f1: { type: number }

  /settings/thresholds:
    get:
      tags: [settings]
      summary: Current thresholds per module
      responses:
        '200':
          description: Mock `mocks/thresholds.json`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Thresholds' }
    put:
      tags: [settings]
      summary: Update thresholds (recomputes risk_level for all findings)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Thresholds' }
      responses:
        '200':
          description: Saved thresholds
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Thresholds' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /sources:
    get:
      tags: [sources]
      summary: List sources
      responses:
        '200':
          description: Mock `mocks/sources.json`
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: './schemas/source.schema.json' } }
    post:
      tags: [sources]
      summary: Add a source
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SourceInput' }
      responses:
        '201':
          description: Created source
          content:
            application/json:
              schema: { $ref: './schemas/source.schema.json' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /sources/{id}:
    parameters:
      - $ref: '#/components/parameters/id'
    patch:
      tags: [sources]
      summary: Edit a source (e.g. toggle active, change schedule)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SourceInput' }
      responses:
        '200':
          description: Updated source
          content:
            application/json:
              schema: { $ref: './schemas/source.schema.json' }
        '404': { $ref: '#/components/responses/NotFound' }

  /scans:
    post:
      tags: [sources]
      summary: Trigger a manual scan of a source
      description: Pushes a message to Redis Stream `iw:scan-requests`. Progress arrives as `scan.started` / `scan.finished` events.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source_id]
              properties:
                source_id: { type: string, format: uuid }
      responses:
        '202':
          description: Scan queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  queued: { type: boolean }
                  source_id: { type: string, format: uuid }
        '404': { $ref: '#/components/responses/NotFound' }

  /documents/{id}/screenshot/{viewport}:
    parameters:
      - $ref: '#/components/parameters/id'
      - { name: viewport, in: path, required: true, schema: { type: string, enum: [desktop, tablet, mobile] } }
    get:
      tags: [documents]
      summary: Screenshot image from MinIO
      responses:
        '200':
          description: PNG image
          content:
            image/png: {}
        '404': { $ref: '#/components/responses/NotFound' }

  /health:
    get:
      tags: [system]
      summary: Status of the API and its dependencies
      responses:
        '200':
          description: Mock `mocks/health.json`
          content:
            application/json:
              schema:
                type: object
                required: [status, services]
                properties:
                  status: { type: string, enum: [ok, degraded, down] }
                  services:
                    type: object
                    additionalProperties: { type: string, enum: [ok, degraded, down] }

components:
  parameters:
    id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    page_size:
      name: page_size
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
  schemas:
    Thresholds:
      type: object
      required: [M1, M2, M3]
      additionalProperties: false
      properties:
        M1: { type: number, minimum: 0, maximum: 1 }
        M2: { type: number, minimum: 0, maximum: 1 }
        M3: { type: number, minimum: 0, maximum: 1 }
    SourceInput:
      type: object
      additionalProperties: false
      properties:
        name: { type: string }
        platform: { type: string, enum: [web, facebook, instagram, tiktok, youtube, x, forum, other] }
        url: { type: string, format: uri }
        source_kind: { type: string, enum: [firm_own, third_party, unknown] }
        target_modules: { type: array, items: { type: string, enum: [M1, M2, M3] }, minItems: 1 }
        schedule_cron: { type: [string, 'null'] }
        active: { type: boolean }
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
        details: {}
  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationError:
      description: Invalid request body or parameters
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
